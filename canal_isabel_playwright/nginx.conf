worker_processes 1;
pid /tmp/nginx.pid;

error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        server_name _;

        root /opt/novnc;

        # ----------------------------------------------------
        # Configuración dinámica para Home Assistant Ingress
        # ----------------------------------------------------

        location = /mandatory.json {
            default_type application/json;

            add_header Cache-Control "no-store, no-cache, must-revalidate";

            return 200 '{"host":"","port":0,"path":"$http_x_ingress_path/websockify","autoconnect":true}';
        }

        location = /defaults.json {
            default_type application/json;
            add_header Cache-Control "no-store";

            return 200 '{}';
        }

        # ----------------------------------------------------
        # WebSocket noVNC -> websockify
        # ----------------------------------------------------

        location /websockify {
            proxy_pass http://127.0.0.1:6080;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            proxy_buffering off;
        }

        # ----------------------------------------------------
        # Archivos estáticos noVNC
        # ----------------------------------------------------

        location / {
            try_files $uri $uri/ =404;
        }
    }
}